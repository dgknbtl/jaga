name: Release

on:
  push:
    branches: [main]

# Never run two releases concurrently; do not cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags + create GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance via OIDC
    steps:
      # Default credentials are kept here: changesets/action pushes the
      # version branch and tags using the workflow token.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # Either opens/updates the "Version Packages" PR (when changesets are
      # pending) or, once that PR is merged, builds with the bumped version
      # and publishes to npm. Auth is tokenless via OIDC trusted publishing
      # (configured on npmjs.com) — provenance is generated automatically.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npx changeset version
          publish: npm run build && npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
