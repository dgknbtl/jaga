name: Release

on:
  push:
    branches: [main]

# Never run two releases concurrently; do not cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags + create GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance via OIDC
    steps:
      # Default credentials are kept here: changesets/action pushes the
      # version branch and tags using the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # Build before the action so dist/ exists for publish. On a "version"
      # run this is harmless; on a "publish" run main already carries the
      # bumped version, so __VERSION__ is injected correctly.
      - run: npm run build
      # Either opens/updates the "Version Packages" PR (when changesets are
      # pending) or, once that PR is merged, publishes to npm. Auth is
      # tokenless via OIDC trusted publishing (configured on npmjs.com) —
      # provenance is generated automatically.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: npx changeset version
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
