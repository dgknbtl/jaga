# Keeps the SHA-pinned GitHub Actions current so the pins don't rot.
# Scoped to actions only to stay low-noise; npm devDeps are bumped manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
